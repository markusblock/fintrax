name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, native-ui-benchmark-base-20261113]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify UI test serialization
        run: |
          bash -n scripts/ui-tests-podman.sh
          bash -n scripts/ui-tests-lock.sh
          bash -n scripts/test-ui-tests-lock.sh
          bash scripts/test-ui-tests-lock.sh
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build and analyze
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.base_ref != 'native-ui-benchmark-base-20261113')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: xvfb-run ./gradlew build sonar
      - name: Build fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: xvfb-run ./gradlew build

  native-ui-benchmark:
    if: github.event_name == 'pull_request' && github.base_ref == 'native-ui-benchmark-base-20261113'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run full UI suite on native x86_64
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"
          /usr/bin/time -p xvfb-run ./gradlew :ui:test
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-benchmark-${{ github.run_id }}
          path: |
            ui/build/test-results/test/
            ui/build/reports/tests/test/
          if-no-files-found: warn
